<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghana Stay - Sign In / Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0F0F0F;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Decorative Shapes */
        .shape {
            position: absolute;
            opacity: 0.8;
        }

        .shape-triangle {
            top: -10%;
            right: -5%;
            width: 0;
            height: 0;
            border-left: 300px solid transparent;
            border-right: 0 solid transparent;
            border-bottom: 520px solid #A89968;
            z-index: 1;
        }

        .shape-circle-top {
            bottom: 0;
            left: -150px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background-color: #E8E3D8;
            z-index: 1;
        }

        .shape-circle-bottom {
            bottom: -100px;
            right: -80px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background-color: #6B5B47;
            z-index: 1;
        }

        .container {
            position: relative;
            width: 768px;
            height: 480px;
            background-color: #FFFFFF;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            z-index: 100;
            display: flex;
        }

        /* Forms Containers */
        .sign-in-container,
        .sign-up-container {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 400ms ease-in 300ms;
            z-index: 5;
        }

        .sign-up-container {
            right: 0;
            background-color: #FFFFFF;
            opacity: 1;
        }

        .sign-in-container {
            left: 0;
            background-color: #FFFFFF;
            opacity: 0;
        }

        .container.right-panel-active .sign-in-container {
            opacity: 1;
        }

        .container.right-panel-active .sign-up-container {
            opacity: 0;
        }

        /* Auth Form */
        .auth-form {
            width: 100%;
            margin: 0 auto;
            padding: 40px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .auth-form h1 {
            color: #D4AF37;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }

        .social-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1.5px solid #D4AF37;
            background-color: #FFFFFF;
            color: #D4AF37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 300ms ease;
            text-decoration: none;
        }

        .social-btn:hover {
            background-color: #D4AF37;
            color: #FFFFFF;
            transform: scale(1.1);
        }

        /* Divider Text */
        .divider-text {
            font-size: 12px;
            color: #999999;
            text-align: center;
            margin: 5px 0;
            width: 100%;
        }

        /* Inputs */
        .form-input {
            width: 100%;
            height: 44px;
            background-color: #F5F5F5;
            border: none;
            border-radius: 6px;
            padding: 0 20px;
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            transition: background-color 300ms ease;
        }

        .form-input::placeholder {
            color: #AAAAAA;
        }

        .form-input:focus {
            outline: none;
            background-color: #EEEEEE;
        }

        .input-wrapper {
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #D4AF37;
            font-size: 14px;
            pointer-events: none;
        }

        .input-wrapper input {
            padding-left: 45px;
        }

        /* Forgot Password */
        .forgot-password {
            color: #999999;
            font-size: 12px;
            text-decoration: none;
            text-align: center;
            width: 100%;
            transition: color 300ms ease;
            margin: 5px 0;
        }

        .forgot-password:hover {
            color: #A89968;
        }

        /* CTA Button */
        .cta-button {
            width: 190px;
            height: 44px;
            background-color: #D4AF37;
            color: #FFFFFF;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Montserrat', sans-serif;
            transition: all 300ms ease;
            margin-top: 10px;
        }

        .cta-button:hover {
            background-color: #C4A84C;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.3);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        /* Overlay Panel */
        .overlay-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            left: 0;
            top: 0;
            background-color: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 700ms cubic-bezier(0.68, -0.55, 0.27, 1.55);
            z-index: 10;
            overflow: hidden;
        }

        .container.right-panel-active .overlay-panel {
            transform: translateX(100%);
        }

        /* Decorative Shapes inside Overlay */
        .overlay-decorative {
            position: absolute;
            opacity: 0.12;
            color: #D4AF37;
        }

        .overlay-diamond {
            font-size: 60px;
            transform: rotate(45deg);
        }

        .overlay-triangle {
            font-size: 40px;
        }

        .overlay-circle {
            font-size: 20px;
        }

        .overlay-diamond-1 {
            top: 10%;
            left: 5%;
            animation: drift 3s ease-in-out infinite;
        }

        .overlay-diamond-2 {
            bottom: 15%;
            right: 10%;
            animation: drift-reverse 3s ease-in-out infinite;
            animation-delay: 0.5s;
        }

        .overlay-triangle-1 {
            top: 25%;
            right: 15%;
            animation: drift 3s ease-in-out infinite;
            animation-delay: 1s;
        }

        .overlay-circle-1 {
            bottom: 30%;
            left: 15%;
            animation: drift-reverse 3s ease-in-out infinite;
            animation-delay: 1.5s;
        }

        .overlay-circle-2 {
            top: 40%;
            right: 8%;
            animation: drift 3s ease-in-out infinite;
            animation-delay: 2s;
        }

        @keyframes drift {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(10px, -10px);
            }
        }

        @keyframes drift-reverse {
            0%, 100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(-10px, 10px);
            }
        }

        /* Overlay Content */
        .overlay-content {
            text-align: center;
            color: #FFFFFF;
        }

        .overlay-content h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .overlay-content p {
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .ghost-button {
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            background-color: transparent;
            padding: 12px 50px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
            transition: all 300ms ease;
            width: 170px;
        }

        .ghost-button:hover {
            background-color: #FFFFFF;
            color: #111111;
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .shape-triangle,
            .shape-circle-top,
            .shape-circle-bottom {
                display: none;
            }

            .auth-form {
                padding: 40px 30px;
            }

            .overlay-panel {
                width: 100%;
                transform: translateY(-100%);
            }

            .container.right-panel-active .overlay-panel {
                transform: translateY(0);
            }

            .sign-in-container,
            .sign-up-container {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Decorative Shapes -->
    <div class="shape shape-triangle"></div>
    <div class="shape shape-circle-top"></div>
    <div class="shape shape-circle-bottom"></div>

    <!-- Main Container -->
    <div class="container" id="container">
        <!-- Overlay Panel -->
        <div class="overlay-panel">
            <div class="overlay-decorative overlay-diamond overlay-diamond-1">
                <i class="fas fa-square"></i>
            </div>
            <div class="overlay-decorative overlay-diamond overlay-diamond-2">
                <i class="fas fa-square"></i>
            </div>
            <div class="overlay-decorative overlay-triangle overlay-triangle-1">
                <i class="fas fa-play"></i>
            </div>
            <div class="overlay-decorative overlay-circle overlay-circle-1">
                <i class="fas fa-circle"></i>
            </div>
            <div class="overlay-decorative overlay-circle overlay-circle-2">
                <i class="fas fa-circle"></i>
            </div>

            <div class="overlay-content" id="overlayContent">
                <h1>Welcome Back!</h1>
                <p>Hover right to create an account</p>
                <button class="ghost-button" id="toggleToSignUpBtn">Sign Up</button>
            </div>
        </div>

        <!-- Sign In Form -->
        <div class="sign-in-container">
            <form class="auth-form" id="signInForm">
                <h1>Sign In</h1>

                <div class="social-buttons">
                    <a href="#" class="social-btn" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-btn" title="Google">
                        <i class="fab fa-google"></i>
                    </a>
                </div>

                <div class="divider-text">or use your email account:</div>

                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" placeholder="Email" required />
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" placeholder="Password" required />
                </div>

                <a href="#" class="forgot-password">Forgot your password?</a>

                <button type="submit" class="cta-button">Sign In</button>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div class="sign-up-container">
            <form class="auth-form" id="signUpForm">
                <h1>Create Account</h1>

                <div class="social-buttons">
                    <a href="#" class="social-btn" title="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-btn" title="Google">
                        <i class="fab fa-google"></i>
                    </a>
                </div>

                <div class="divider-text">or use your email for registration:</div>

                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-input" placeholder="Name" required />
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" placeholder="Email" required />
                </div>

                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" placeholder="Password" required />
                </div>

                <button type="submit" class="cta-button">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
